[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "reqon-ai"
version = "0.1.0"
description = "Reqon AI: crawl → plan → execute → report QA pipeline with an HTTP API."
readme = "frontend/README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Reqon Research" }]

dependencies = [
  # Browser automation
  "playwright>=1.50.0,<2.0.0",

  # Data models (codebase uses Pydantic v2 APIs like field_validator)
  "pydantic>=2.7.0,<3.0.0",

  # Synthetic data generation
  "faker>=24.0.0,<26.0.0",

  # API server
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",

  # Async file IO (useful for uploads/log streaming)
  "aiofiles>=24.1.0,<25.0.0",

  # Better CLI/log formatting
  "rich>=13.7.0,<14.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "shared", "api"]

